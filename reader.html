<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Note Reader</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="reader-page">
<header class="reader-topbar">
  <a class="button secondary" href="index.html">← 科研工作台</a>
  <div class="reader-tools">
    <a class="button secondary" href="index.html#library" style="white-space:nowrap">全部资料</a>
    <input id="docSearch" type="search" placeholder="搜索本文…">
    <button class="button secondary" id="clearSearch">清除</button>
  </div>
</header>
<div class="reader-shell">
  <aside id="toc" class="reader-toc">
    <div class="toc-title">本文目录</div>
    <div id="tocLinks" class="toc-links"></div>
  </aside>
  <main class="reader-main">
    <aside id="documentStatus" class="document-status" role="note">正在读取文档用途…</aside>
    <div id="searchInfo" class="search-info" hidden></div>
    <article id="content" class="reader-body">加载中…</article>
  </main>
</div>
<script>
marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});
const params=new URLSearchParams(location.search);
const path=params.get('path')||'research/zeva-rlt-implementation-2026-09-26.md';
const content=document.getElementById('content');
const tocLinks=document.getElementById('tocLinks');
const searchInput=document.getElementById('docSearch');
const searchInfo=document.getElementById('searchInfo');

function normalizeMarkdown(md){
  return md
    .replace(/^\\([#>|])/gm,'$1')
    .replace(/\\\|/g,'|')
    .replace(/\*{4,}/g,'')
    .replace(/^[ \t]+\|/gm,'|');
}
function slugify(text){
  const base=text.trim().toLowerCase()
    .replace(/<[^>]+>/g,'')
    .replace(/[^\w\u4e00-\u9fff-]+/g,'-')
    .replace(/^-+|-+$/g,'');
  return base||'section';
}
function buildToc(){
  tocLinks.innerHTML='';
  const hs=[...content.querySelectorAll('h1,h2,h3')];
  const used=new Set([...content.querySelectorAll('[id]')].map(el=>el.id));
  hs.forEach((h,i)=>{
    const base=slugify(h.textContent);
    if(!h.id){let id=base,n=1;while(used.has(id))id=base+'-'+n++;h.id=id;used.add(id);}
    // Preserve links previously generated by this reader.
    const oldId=base+'-'+i;
    if(!used.has(oldId)){const alias=document.createElement('span');alias.id=oldId;h.before(alias);used.add(oldId);}

    const a=document.createElement('a');
    a.href='#'+h.id;
    a.textContent=h.textContent;
    a.className='toc-'+h.tagName.toLowerCase();
    tocLinks.appendChild(a);
  });
}
function resolveDocumentLinks(){
  const siteBase=new URL('./',location.href);
  const documentURL=new URL(path,siteBase);
  content.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href');
    if(!href||href.startsWith('#')||/^[a-z][a-z0-9+.-]*:/i.test(href)||href.startsWith('//'))return;
    const resolved=new URL(href,documentURL);
    const relative=resolved.pathname.startsWith(siteBase.pathname)?resolved.pathname.slice(siteBase.pathname.length):'';
    if(resolved.origin===siteBase.origin&&relative.startsWith('survey-rsi/')){
      a.href='https://github.com/nkd-lkz/physical-self-evolution/blob/main/'+relative+resolved.hash;
    }else if(resolved.origin===siteBase.origin&&/^(research|notes)\/[a-zA-Z0-9._\/-]+\.md$/.test(relative)){
      const reader=new URL('reader.html',siteBase);
      reader.searchParams.set('path',relative);
      reader.hash=resolved.hash;
      a.href=reader.href;
    }else{a.href=resolved.href;}
  });
  content.querySelectorAll('img[src]').forEach(img=>{
    const src=img.getAttribute('src');
    if(src&&!/^[a-z][a-z0-9+.-]*:/i.test(src)&&!src.startsWith('//'))img.src=new URL(src,documentURL).href;
  });
}
function clearHighlights(){
  content.querySelectorAll('mark.search-hit').forEach(mark=>{
    const parent=mark.parentNode;
    parent.replaceChild(document.createTextNode(mark.textContent),mark);
    parent.normalize();
  });
}
function escapeRegExp(s){ return s.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&'); }
function highlight(term){
  clearHighlights();
  if(!term){searchInfo.hidden=true;return;}
  const re=new RegExp(escapeRegExp(term),'gi');
  let count=0, first=null;
  const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      if(!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if(['SCRIPT','STYLE','CODE','PRE'].includes(node.parentElement?.tagName)) return NodeFilter.FILTER_REJECT;
      re.lastIndex=0;
      return re.test(node.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
    }
  });
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    re.lastIndex=0;
    const frag=document.createDocumentFragment();
    let last=0,m;
    while((m=re.exec(node.nodeValue))!==null){
      frag.appendChild(document.createTextNode(node.nodeValue.slice(last,m.index)));
      const mark=document.createElement('mark'); mark.className='search-hit'; mark.textContent=m[0];
      frag.appendChild(mark); if(!first) first=mark; count++; last=m.index+m[0].length;
    }
    frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  searchInfo.hidden=false;
  searchInfo.textContent='找到 '+count+' 处匹配';
  if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
}
async function showDocumentStatus(){
  const box=document.getElementById('documentStatus');
  try{
    const response=await fetch('data/document-registry.json');
    if(!response.ok)throw Error('HTTP '+response.status);
    const registry=await response.json();
    const entry=registry.documents[path];
    const info=entry?registry.roles[entry.role]:null;
    box.replaceChildren();
    const title=document.createElement('strong');title.textContent=info?info.label:'用途尚未登记';box.append(title);
    if(entry)box.dataset.role=entry.role;
    const dates=document.createElement('p');
    dates.textContent='内容日期：'+(entry?.content_date||'未标注')+(entry?.reviewed_at?' · 资料复核：'+entry.reviewed_at:'')+' · 不代表新增实验';box.append(dates);
    const note=document.createElement('p');note.textContent=info?.note||'请核对文内日期和证据，不能仅凭标题判断这是现行方案。';box.append(note);
    const link=document.createElement('a');link.href='reader.html?path='+encodeURIComponent(registry.current_path);link.textContent=path===registry.current_path?'查看下一步实验 →':'回到当前研究方案 →';if(path===registry.current_path)link.hash='next-experiments';box.append(link);
  }catch{
    box.textContent='文档用途读取失败。请核对文内日期；本页未被确认为当前方案。';
  }
}
function scrollToFragment(){
  try{
    const offset=document.querySelector('.reader-topbar').getBoundingClientRect().height+16;
    content.style.setProperty('--reader-scroll-offset',offset+'px');
    document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView({behavior:'instant'});
  }catch{}
}
window.addEventListener('hashchange',scrollToFragment);
if(!/^(research|notes)\/[a-zA-Z0-9._\/-]+\.md$/.test(path)||path.split('/').some(p=>p==='..'||p==='.')){
  content.textContent='非法路径';document.getElementById('documentStatus').textContent='未加载文档';
}else{
  const statusReady=showDocumentStatus();
  fetch(path).then(r=>r.ok?r.text():Promise.reject(new Error('HTTP '+r.status)))
    .then(async t=>{ content.innerHTML=marked.parse(normalizeMarkdown(t)); resolveDocumentLinks(); buildToc(); document.title=(content.querySelector("h1")?.textContent||"Research Note")+" · RLT"; await statusReady; requestAnimationFrame(scrollToFragment); })
    .catch(e=>{content.textContent='读取失败：'+path+' · '+e.message;});
}
let searchTimer;
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>highlight(searchInput.value.trim()),180);
});
document.getElementById('clearSearch').addEventListener('click',()=>{
  searchInput.value=''; clearHighlights(); searchInfo.hidden=true;
});
</script>
</body>
</html>
